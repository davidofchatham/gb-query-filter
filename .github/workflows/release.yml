name: Build release ZIP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.3.0)'
        required: true

env:
  PLUGIN_SLUG: gb-query-filter

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Untrusted input (the workflow_dispatch tag) is passed through the
      # environment, never interpolated into the shell before parsing.
      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::Tag '$TAG' must look like v<version>, e.g. v0.3.0"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify plugin header matches tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          HEADER_VERSION=$(grep -m1 '^ \* Version:' "${PLUGIN_SLUG}.php" | sed 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')
          CONST_VERSION=$(grep -m1 "define( 'GBQF_VERSION'" "${PLUGIN_SLUG}.php" | sed "s/.*'\\([0-9][^']*\\)'.*/\\1/")
          echo "Tag: $VERSION | Header: $HEADER_VERSION | Constant: $CONST_VERSION"
          if [ "$HEADER_VERSION" != "$VERSION" ]; then
            echo "::error::Plugin header version ($HEADER_VERSION) does not match tag ($VERSION)"
            exit 1
          fi
          if [ "$CONST_VERSION" != "$VERSION" ]; then
            echo "::error::GBQF_VERSION ($CONST_VERSION) does not match tag ($VERSION)"
            exit 1
          fi

      - name: Stage clean plugin directory
        run: |
          mkdir -p build/"$PLUGIN_SLUG"
          rsync -a --exclude-from=.distignore --exclude='build' ./ build/"$PLUGIN_SLUG"/

      - name: Create ZIP
        id: zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP="${PLUGIN_SLUG}-${VERSION}.zip"
          ( cd build && zip -r "../$ZIP" "$PLUGIN_SLUG" )
          unzip -l "$ZIP"
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_SLUG }}-${{ steps.version.outputs.version }}
          path: ${{ steps.zip.outputs.path }}

      - name: Attach ZIP to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: ${{ steps.zip.outputs.path }}
